<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="clip-top">
      <rect x="0" y="0" width="100" height="50"/>
    </clipPath>
    <clipPath id="clip-bottom">
      <rect x="0" y="50" width="100" height="50"/>
    </clipPath>
    <clipPath id="clip-circle">
      <circle cx="50" cy="50" r="46"/>
    </clipPath>
  </defs>

  <!-- Bottom half: blue -->
  <circle cx="50" cy="50" r="46" fill="#0057D8"/>

  <!-- Top half: white, clipped to circle shape -->
  <rect x="0" y="0" width="100" height="50" fill="#ffffff" clip-path="url(#clip-circle)"/>

  <!-- AR text — top half: blue on white -->
  <text
    x="50" y="48.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="38"
    fill="#0057D8"
    clip-path="url(#clip-top)"
  >AR</text>

  <!-- AR text — bottom half: white on blue -->
  <text
    x="50" y="48.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="38"
    fill="#ffffff"
    clip-path="url(#clip-bottom)"
  >AR</text>

  <!-- Circle border -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#000000" stroke-width="4"/>
</svg>
